name: "unified-service-scheduler"

services:
  scheduler-app:
    container_name: scheduler-app
    build:
      context: docker/app/local
    volumes:
      # Source code volumes
      - ./internal:/app/internal
      - ./cmd:/app/cmd
      # Go module files
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      # Go cache volumes
      - ./.go/pkg:/app/go/pkg
      - ./.go-cache:/app/go-cache
    working_dir: /app
    ports:
      - "127.0.0.1:4000:$PORT" # App port
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-false}"
      GOCACHE: /app/go-cache
    depends_on:
      scheduler-db:
        condition: service_healthy
    # - keycloak
    networks:
      - scheduler-network

  scheduler-db:
    image: postgres:17-alpine
    container_name: scheduler-db
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USERNAME:-user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_NAME:-scheduler_service}"
    volumes:
      - scheduler-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

volumes:
  scheduler-db-data:

networks:
  scheduler-network:

