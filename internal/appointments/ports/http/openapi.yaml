openapi: 3.0.3
info:
  title: Appointments API
  version: 1.0.0
paths:
  /appointments:
    post:
      operationId: requestBooking
      summary: Request a booking, holding a technician and service bay with a reservation
      parameters:
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBookingRequest'
      responses:
        '201':
          description: Booking requested, reservation held. Fetch the appointment details and hold expiry via GET /reservations/{reservationUuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestBookingResponse'
        '400':
          description: Invalid appointment or vehicle input (invalid-appointment / invalid-vehicle / missing-idempotency-key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: X-User-Id header is missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown service type (service-type-not-found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No technician or service bay is free for this time (no-availability)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reservations/{reservationUuid}/confirm:
    post:
      operationId: confirmAppointment
      summary: Confirm a pending appointment using its reservation
      parameters:
        - name: reservationUuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ReservationUUID'
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Appointment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmAppointmentResponse'
        '400':
          description: Reservation does not belong to the appointment it targets (reservation-mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: X-User-Id header is missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation or appointment not found (reservation-not-found / appointment-not-found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Appointment is no longer pending confirmation (appointment-not-pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Reservation has expired (reservation-expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reservations/{reservationUuid}:
    get:
      operationId: getReservation
      summary: Get a reservation together with its appointment
      parameters:
        - name: reservationUuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ReservationUUID'
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Reservation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReservationResponse'
        '401':
          description: X-User-Id header is missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation not found (or not owned by the caller)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /appointments/{appointmentUuid}/cancel:
    post:
      operationId: cancelAppointment
      summary: Cancel a confirmed appointment
      parameters:
        - name: appointmentUuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppointmentUUID'
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Appointment cancelled
        '400':
          description: Appointment start time has already passed (appointment-in-the-past)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: X-User-Id header is missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Appointment not found (or not owned by the caller)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Appointment is not confirmed, or already cancelled (appointment-not-confirmed / appointment-already-cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RequestBookingRequest:
      type: object
      required: [dealerShipId, serviceType, startTime, vehicle]
      properties:
        dealerShipId:
          type: string
        serviceType:
          type: string
        startTime:
          type: string
          format: date-time
        vehicle:
          $ref: '#/components/schemas/RequestBookingVehicle'
    RequestBookingVehicle:
      type: object
      required: [makeCode, modelName, modelYear]
      properties:
        makeCode:
          type: string
        modelName:
          type: string
        modelYear:
          type: integer
        licensePlate:
          type: string
    RequestBookingResponse:
      type: object
      required: [reservationUuid]
      properties:
        reservationUuid:
          $ref: '#/components/schemas/ReservationUUID'
    ConfirmAppointmentResponse:
      type: object
      required: [appointmentUuid, status]
      properties:
        appointmentUuid:
          $ref: '#/components/schemas/AppointmentUUID'
    AppointmentUUID:
      type: string
      format: uuid
      description: UUID of the appointment
      x-go-type: domain.AppointmentUUID
      x-go-type-import:
        path: scheduler/internal/appointments/domain
    ReservationUUID:
      type: string
      format: uuid
      description: UUID of the reservation
      x-go-type: domain.ReservationUUID
      x-go-type-import:
        path: scheduler/internal/appointments/domain
    AppointmentStatus:
      type: string
      enum: [pending, confirmed, cancelled]
      description: Status of the appointment
      x-go-type: domain.AppointmentStatus
      x-go-type-import:
        path: scheduler/internal/appointments/domain
    VehicleUUID:
      type: string
      format: uuid
      description: UUID of the vehicle
      x-go-type: domain.VehicleUUID
      x-go-type-import:
        path: scheduler/internal/appointments/domain
    GetReservationResponse:
      type: object
      required: [reservationUuid, createdAt, expiredAt, appointment]
      properties:
        reservationUuid:
          $ref: '#/components/schemas/ReservationUUID'
        createdAt:
          type: string
          format: date-time
        expiredAt:
          type: string
          format: date-time
        appointment:
          $ref: '#/components/schemas/AppointmentDetailResponse'
    AppointmentDetailResponse:
      type: object
      required: [appointmentUuid, status, dealerShipId, serviceBayId, technicianId, serviceType, vehicleUuid, startTime, estimatedEndTime]
      properties:
        appointmentUuid:
          $ref: '#/components/schemas/AppointmentUUID'
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        dealerShipId:
          type: string
        serviceBayId:
          type: string
        technicianId:
          type: string
        serviceType:
          type: string
        vehicleUuid:
          $ref: '#/components/schemas/VehicleUUID'
        startTime:
          type: string
          format: date-time
        estimatedEndTime:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [slug, message]
      properties:
        message:
          type: string
        slug:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        entity_type:
          type: string
        entity_id:
          type: string
        error_slug:
          type: string
        message:
          type: string
